<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conectar con Google</title>
  </head>
  <body>
    <div class="container">
      <h1>Conectar tu cuenta de Google</h1>
      <p>
        Haz clic en el botón para vincular tu cuenta con Google Calendar y
        Gmail.
      </p>

      <button id="connectGoogleBtn">Conectar con Google</button>
    </div>

    <script>
      const userJwtToken =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6ImNiOTg5MmVhLWZjNDUtNDMyMS04ZWE4LTEzMzlkY2YzMWFkZSIsImVtYWlsIjoiYmVuamFkZWxjYW1wbzE1QGdtYWlsLmNvbSIsInJvbGUiOiJsYXd5ZXIiLCJpYXQiOjE3NjAyMDI1MDUsImV4cCI6MTc2MDI4ODkwNX0.zuhAT_G7uim-5JxOrxOBE6YCzQBtZ-IMnkXrh6S7W-w";

      document
        .getElementById("connectGoogleBtn")
        .addEventListener("click", async () => {
          try {
            // Asegúrate de que el método sea GET
            const isLocal =
              window.location.hostname === "localhost" ||
              window.location.hostname === "127.0.0.1";
            const backendUrl = isLocal
              ? "http://localhost:3000/auth/google/connect"
              : "https://api.ibarrayasoc.com/auth/google/connect";

            const email = "benjadelcampo15@gmail.com"; // Esto debería venir dinámico idealmente

            const response = await fetch(
              `${backendUrl}?email=${encodeURIComponent(email)}`,
              {
                method: "GET",
                headers: { Authorization: `Bearer ${userJwtToken}` },
              }
            );

            if (response.ok) {
              const data = await response.json();
              // El servidor debería devolver un JSON con la URL de redirección
              window.location.href = data.redirectUrl;
            } else {
              console.error(
                "Error al iniciar el flujo de Google:",
                response.status
              );
            }
          } catch (error) {
            console.error("Error de red:", error);
          }
        });
    </script>
  </body>
</html>
