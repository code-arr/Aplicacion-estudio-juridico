name: Build & Publish (Unified)

on:
  push:
    branches: [main, front]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    env:
      # Ajustá esto si necesitás cambiar las variables de entorno
      VITE_DEV_SERVER_URL: "http://localhost:5173"
      VITE_API_BASE_URL: "https://api.ibarrayasoc.com"
      VITE_APP_TZ: "America/Santiago"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: "npm"
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        working-directory: ./front
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
        shell: bash

      # Construimos el Frontend y el Backend de Electron
      - name: Build App
        working-directory: ./front
        run: npm run build
        shell: bash

      # Generamos el config.json necesario
      - name: Create runtime config
        working-directory: ./front
        run: |
          mkdir -p resources
          cat > resources/config.json <<-JSON
          {
            "API_BASE": "${{ env.VITE_API_BASE_URL }}",
            "APP_TZ": "${{ env.VITE_APP_TZ }}",
            "DEV_SERVER_URL": "${{ env.VITE_DEV_SERVER_URL }}"
          }
          JSON
        shell: bash

      # Empaquetamos los ejecutables (.exe / .dmg)
      - name: Build Electron Installers
        working-directory: ./front
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Usamos build:electron:ci que tiene --publish=never
          # (Porque vamos a subir los archivos nosotros manualmente abajo)
          npm run build:electron:ci
        shell: bash

      # Leemos la versión del package.json para saber qué Tag usar
      - name: Get Version
        id: get_version
        working-directory: ./front
        shell: bash
        run: |
          VER=$(jq -r .version package.json)
          echo "VERSION=v$VER" >> $GITHUB_OUTPUT
          echo "Detected version: v$VER"

      # 🔥 LA MAGIA: Subimos los archivos DIRECTO a la Release
      # Sin usar artifacts, sin pasos extra.
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          # Sube todo lo que haya generado electron-builder (exe, dmg, yml, blockmap)
          files: |
            front/release/*.exe
            front/release/*.dmg
            front/release/*.zip
            front/release/latest*.yml
            front/release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
