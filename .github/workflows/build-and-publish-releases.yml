name: Build & Publish Electron App (Releases)

on:
  push:
    branches: [ main, front ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    env:
      VITE_DEV_SERVER_URL: "http://localhost:5173"
      VITE_API_BASE_URL: "http://estudio-backend-dev.us-east-1.elasticbeanstalk.com"
      VITE_APP_TZ: "America/Santiago"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        working-directory: ./front
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
        shell: bash

      - name: Build frontend (Vite) and compile electron TS
        working-directory: ./front
        run: npm run build
        shell: bash

      - name: Create runtime config
        working-directory: ./front
        run: |
          mkdir -p resources
          cat > resources/config.json <<-JSON
          {
            "API_BASE": "${{ env.VITE_API_BASE_URL }}",
            "APP_TZ": "${{ env.VITE_APP_TZ }}",
            "DEV_SERVER_URL": "${{ env.VITE_DEV_SERVER_URL }}"
          }
          JSON
        shell: bash

      - name: Build electron installers (CI mode - no signing)
        working-directory: ./front
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ""
          CSC_KEY_PASSWORD: ""
        run: |
          npm run build:electron:ci
        shell: bash

      - name: Inspect generated release folder (debug)
        working-directory: ./front
        run: |
          echo ">>> listing front/release"
          ls -la release || true
          echo ">>> listing front/release/*"
          for f in release/*; do echo " - $f"; done || true
        shell: bash

      # -------------------------
      # NUEVO: crear release draft y subir assets DIRECTO desde este job
      # Evita usar actions/upload-artifact (que consume el storage que está agotado)
      - name: Create draft release and upload installers (avoid artifacts)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="release-${{ github.run_id }}"
          API="https://api.github.com"
          AUTH="Bearer $GITHUB_TOKEN"

          echo "Creating draft release tag=$TAG ..."
          CREATE=$(curl -s -X POST -H "Authorization: $AUTH" -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"body\":\"CI build $TAG\",\"draft\":true}" \
            "$API/repos/${{ github.repository }}/releases")

          UPLOAD_URL=$(jq -r .upload_url <<<"$CREATE" | sed -e 's/{?name,label}//')
          if [ -z "$UPLOAD_URL" ] || [ "$UPLOAD_URL" = "null" ]; then
            echo "Failed to create release:"
            echo "$CREATE"
            exit 1
          fi

          echo "Uploading installer files to release..."
          for f in front/release/*; do
            if [ -f "$f" ]; then
              FNAME=$(basename "$f")
              echo " -> $FNAME"
              # url-encode filename
              ENCODED=$(python3 - <<PY
              import urllib.parse,sys
              print(urllib.parse.quote(sys.argv[1]))
              PY
              "$FNAME")
              curl --fail -X POST -H "Authorization: $AUTH" \
                -H "Content-Type: application/octet-stream" --data-binary @"$f" \
                "$UPLOAD_URL?name=$ENCODED"
            fi
          done

          echo "Draft release created: https://github.com/${{ github.repository }}/releases/tag/$TAG"
        shell: bash

      # Fin job build
  publish_release:
    needs: build
    runs-on: ubuntu-latest
    env:
      RUN_TAG: release-${{ github.run_id }}
    steps:
      # Nota: ya no descargamos artifacts (no los generamos). En cambio:
      # 1) buscamos la release que creó el job 'build' (tag = release-<run_id>)
      # 2) la convertimos a non-draft/public (si existe)
      # 3) copiamos sus assets y los subimos a la release "latest" (reemplazando los existentes)
      - name: Ensure release exists and make it public (non-draft)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          API="https://api.github.com"
          AUTH="Bearer ${{ secrets.GITHUB_TOKEN }}"
          RELEASE_TAG="${{ env.RUN_TAG }}"

          echo "Looking for release with tag $RELEASE_TAG ..."
          RELEASE=$(curl -s -H "Authorization: $AUTH" "$API/repos/${{ github.repository }}/releases/tags/$RELEASE_TAG" || true)
          RELEASE_ID=$(jq -r .id <<<"$RELEASE" || true)

          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "Release $RELEASE_TAG not found. Creating it (fallback)..."
            CREATE=$(curl -s -X POST -H "Authorization: $AUTH" -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$RELEASE_TAG\",\"name\":\"$RELEASE_TAG\",\"body\":\"Auto-generated release $RELEASE_TAG\",\"draft\":false}" \
              "https://api.github.com/repos/${{ github.repository }}/releases")
            RELEASE_ID=$(jq -r .id <<<"$CREATE")
            echo "Created release id=$RELEASE_ID"
          else
            echo "Found release id=$RELEASE_ID. Updating to non-draft..."
            # patch release to set draft=false (publish it)
            curl -s -X PATCH -H "Authorization: $AUTH" -H "Content-Type: application/json" \
              -d "{\"draft\":false,\"name\":\"Release $RELEASE_TAG\",\"body\":\"Release published from CI run $RELEASE_TAG\"}" \
              "$API/repos/${{ github.repository }}/releases/$RELEASE_ID" > /dev/null
            echo "Release $RELEASE_TAG set to non-draft."
          fi

          # list assets on the release (we will reuse them to populate 'latest')
          echo "Listing assets for release id=$RELEASE_ID..."
          curl -s -H "Authorization: $AUTH" "$API/repos/${{ github.repository }}/releases/$RELEASE_ID/assets" \
            | jq -r '.[] | "\(.id) \(.name) \(.browser_download_url)"' > /tmp/assets.list || true
          echo "Assets:"
          cat /tmp/assets.list || true
        shell: bash

      - name: Create-or-update 'latest' release and copy assets from run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          API="https://api.github.com"
          AUTH="Bearer ${{ secrets.GITHUB_TOKEN }}"
          LATEST_TAG="latest"
          RUN_RELEASE_TAG="${{ env.RUN_TAG }}"

          echo "Ensure 'latest' release exists..."
          LID=$(curl -s -H "Authorization: $AUTH" "$API/repos/${{ github.repository }}/releases/tags/$LATEST_TAG" | jq -r .id)
          if [ -z "$LID" ] || [ "$LID" = "null" ]; then
            echo "Creating 'latest' release..."
            CREATE=$(curl -s -X POST -H "Authorization: $AUTH" -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$LATEST_TAG\",\"name\":\"Latest\",\"body\":\"Latest build for testers (auto)\",\"draft\":false,\"prerelease\":false}" \
              "$API/repos/${{ github.repository }}/releases")
            LID=$(jq -r .id <<<"$CREATE")
            echo "Created latest id=$LID"
          else
            echo "'latest' exists (id=$LID)."
          fi

          # delete existing assets on 'latest'
          echo "Deleting existing assets on 'latest' (id=$LID) ..."
          EXISTING_IDS=$(curl -s -H "Authorization: $AUTH" "$API/repos/${{ github.repository }}/releases/$LID/assets" | jq -r '.[].id' || true)
          for aid in $EXISTING_IDS; do
            if [ -n "$aid" ] && [ "$aid" != "null" ]; then
              echo "Deleting asset id $aid"
              curl -s -X DELETE -H "Authorization: $AUTH" "$API/repos/${{ github.repository }}/releases/assets/$aid" || true
            fi
          done

          # get assets from the run release (populated in previous step)
          echo "Copying assets from run release ${RUN_RELEASE_TAG} to 'latest'..."
          RUN_RELEASE_ID=$(curl -s -H "Authorization: $AUTH" "$API/repos/${{ github.repository }}/releases/tags/${RUN_RELEASE_TAG}" | jq -r .id)
          if [ -z "$RUN_RELEASE_ID" ] || [ "$RUN_RELEASE_ID" = "null" ]; then
            echo "Run release not found, nothing to copy."
            exit 0
          fi

          curl -s -H "Authorization: $AUTH" "$API/repos/${{ github.repository }}/releases/$RUN_RELEASE_ID/assets" \
            | jq -c '.[]' | while read -r asset; do
              NAME=$(jq -r .name <<<"$asset")
              BURL=$(jq -r .browser_download_url <<<"$asset")
              echo " -> copying $NAME"
              # download asset to tmp
              TMPF="/tmp/$NAME"
              curl -sL -H "Authorization: $AUTH" -o "$TMPF" "$BURL"
              # URL-encode filename
              ENCODED=$(python3 - <<PY
              import urllib.parse,sys
              print(urllib.parse.quote(sys.argv[1]))
              PY
              "$NAME")
              UPLOAD_URL="https://uploads.github.com/repos/${{ github.repository }}/releases/$LID/assets?name=$ENCODED"
              curl --fail -X POST -H "Authorization: $AUTH" -H "Content-Type: application/octet-stream" --data-binary @"$TMPF" "$UPLOAD_URL"
              rm -f "$TMPF"
            done

          echo "Latest release updated: https://github.com/${{ github.repository }}/releases/tag/latest"
        shell: bash

      - name: Final info
        run: |
          echo "Run release: https://github.com/${{ github.repository }}/releases/tag/${{ env.RUN_TAG }}"
          echo "Latest release: https://github.com/${{ github.repository }}/releases/tag/latest"
        shell: bash

