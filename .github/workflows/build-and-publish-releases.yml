name: Build & Publish Electron App (Releases)

on:
  push:
    branches: [ main, front ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        working-directory: ./front
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
        shell: bash

      - name: Build frontend (Vite) and compile electron TS
        working-directory: ./front
        run: npm run build
        shell: bash

      - name: Build electron installers
        working-directory: ./front
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:electron
        shell: bash

      - name: Inspect generated release folder (debug)
        working-directory: ./front
        run: |
          echo ">>> listing front/release"
          ls -la release || true
          echo ">>> listing front/release/*"
          for f in release/*; do echo " - $f"; done || true
        shell: bash

      - name: Collect release artifacts
        if: always()
        run: |
          mkdir -p release-${{ matrix.os }}
          cp -r front/release/* release-${{ matrix.os }}/ || true
          echo "ARTIFACT_DIR=release-${{ matrix.os }}" >> $GITHUB_ENV
          echo "Contents of release-${{ matrix.os}}:"
          ls -la release-${{ matrix.os}} || true
        shell: bash

      - name: Upload artifact (platform-specific)
        uses: actions/upload-artifact@v4
        with:
          name: electron-installers-${{ matrix.os }}
          path: release-${{ matrix.os }}

  publish_release:
    needs: build
    runs-on: ubuntu-latest
    env:
      RUN_TAG: release-${{ github.run_id }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./collected

      - name: List collected files
        run: |
          echo "FILES in collected:"
          find ./collected -maxdepth 3 -type f -print || true
        shell: bash

      - name: Create release for this run (tag = run id)
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ env.RUN_TAG }}
          release_name: Release ${{ env.RUN_TAG }} (from run ${{ github.run_id }})
          body: |
            Auto-generated release from commit ${{ github.sha }} on branch ${{ github.ref_name }}.
            **Private** repo: only collaborators can download.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach important assets only (exe/dmg/blockmap)
        if: always()
        run: |
          set -euo pipefail
          RELEASE_TAG="${{ env.RUN_TAG }}"
          API="https://api.github.com"
          AUTH="Bearer ${{ secrets.GITHUB_TOKEN }}"
      
          RELEASE_ID=$(curl -s -H "Authorization: $AUTH" "$API/repos/${{ github.repository }}/releases/tags/$RELEASE_TAG" | jq -r .id)
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "Release id not found for $RELEASE_TAG"
            exit 1
          fi
      
          # find only files we want (case-insensitive)
          find ./collected -type f \( -iname "*.exe" -o -iname "*.dmg" -o -iname "*.exe.blockmap" -o -iname "*.dmg.blockmap" \) -print0 \
            | while IFS= read -r -d '' f; do
              FNAME=$(basename "$f")
              echo "Uploading asset: $FNAME from $f"
              # delete existing asset with same name (if any)
              EXISTING_ID=$(curl -s -H "Authorization: $AUTH" "$API/repos/${{ github.repository }}/releases/$RELEASE_ID/assets" | jq -r --arg name "$FNAME" '.[] | select(.name==$name) | .id' | head -n1)
              if [ -n "$EXISTING_ID" ] && [ "$EXISTING_ID" != "null" ]; then
                echo "Deleting existing asset id $EXISTING_ID (name: $FNAME)"
                curl -s -X DELETE -H "Authorization: $AUTH" "$API/repos/${{ github.repository }}/releases/assets/$EXISTING_ID"
              fi
      
              # safe upload (escape name for URL)
              ENCODED_NAME=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$FNAME")
              UPLOAD_URL="https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=$ENCODED_NAME"
              curl --fail -X POST -H "Authorization: $AUTH" -H "Content-Type: application/octet-stream" --data-binary @"$f" "$UPLOAD_URL"
              echo " -> uploaded $FNAME"
            done
        shell: bash

      - name: Create-or-update 'latest' release and attach assets (robust)
        run: |
          set -euo pipefail
          API="https://api.github.com"
          AUTH="Bearer ${{ secrets.GITHUB_TOKEN }}"
          LATEST_TAG="latest"

          # check or create latest release
          echo "Checking for existing 'latest' release..."
          LID=$(curl -s -H "Authorization: $AUTH" "$API/repos/${{ github.repository }}/releases/tags/$LATEST_TAG" | jq -r .id)
          if [ -z "$LID" ] || [ "$LID" = "null" ]; then
            echo "Creating new 'latest' release..."
            CREATE=$(curl -s -X POST -H "Authorization: $AUTH" -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$LATEST_TAG\",\"name\":\"Latest\",\"body\":\"Latest build for testers (auto)\",\"draft\":false,\"prerelease\":false}" \
              "$API/repos/${{ github.repository }}/releases")
            LID=$(jq -r .id <<<"$CREATE")
          else
            echo "'latest' release exists (id=$LID)."
          fi

          # remove existing assets on 'latest' (optional, to replace)
          echo "Listing existing assets on latest (id=$LID) and deleting them..."
          EXISTING_IDS=$(curl -s -H "Authorization: $AUTH" "$API/repos/${{ github.repository }}/releases/$LID/assets" | jq -r '.[].id' || true)
          for aid in $EXISTING_IDS; do
            if [ -n "$aid" ] && [ "$aid" != "null" ]; then
              echo "Deleting existing asset id $aid"
              curl -s -X DELETE -H "Authorization: $AUTH" "$API/repos/${{ github.repository }}/releases/assets/$aid"
            fi
          done

          # upload only the installer files (exe, dmg and their blockmaps)
          echo "Uploading installer files to 'latest'..."
          find ./collected -type f \( -iname "*.exe" -o -iname "*.dmg" -o -iname "*.exe.blockmap" -o -iname "*.dmg.blockmap" \) -print0 \
            | while IFS= read -r -d '' f; do
                FNAME=$(basename "$f")
                echo " -> Uploading $FNAME from $f"
                ENCODED_NAME=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$FNAME")
                UPLOAD_URL="https://uploads.github.com/repos/${{ github.repository }}/releases/$LID/assets?name=$ENCODED_NAME"
                curl --fail -X POST -H "Authorization: $AUTH" -H "Content-Type: application/octet-stream" --data-binary @"$f" "$UPLOAD_URL"
                echo "    uploaded $FNAME"
            done

          echo "Latest release updated: https://github.com/${{ github.repository }}/releases/tag/latest"
        shell: bash

      - name: Final info
        run: |
          echo "Run release: https://github.com/${{ github.repository }}/releases/tag/${{ env.RUN_TAG }}"
          echo "Latest release: https://github.com/${{ github.repository }}/releases/tag/latest"
        shell: bash

