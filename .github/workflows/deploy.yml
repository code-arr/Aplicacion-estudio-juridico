name: Deploy NestJS to Elastic Beanstalk

on:
  push:
    branches:
      - back

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Change to backend directory
        run: cd back

      - name: Install dependencies
        run: |
          cd back
          npm install

      - name: Build
        run: |
          cd back
          npm run build

      - name: Zip for deployment
        run: |
          cd back
          zip -r ../app.zip dist package.json package-lock.json Procfile

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: estudio-backend-dev
          environment_name: estudio-backend-dev-env
          version_label: v-${{ github.run_number }}
          region: us-east-1
          deployment_package: app.zip